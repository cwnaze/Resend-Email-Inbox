<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<script>
			// Apply any persisted explicit theme choice before first paint, so
			// there's no flash of the wrong (OS-default) palette on load.
			(function () {
				try {
					var stored = localStorage.getItem('dusk-terminal-theme');
					if (stored === 'dark' || stored === 'light') {
						document.documentElement.setAttribute('data-theme', stored);
					}
				} catch (e) {
					/* localStorage unavailable (e.g. privacy mode) — fall back to prefers-color-scheme */
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
